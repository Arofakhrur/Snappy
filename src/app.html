<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#FBF7F0" />
		<meta name="description" content="DISTUDIO Photobooth — Take fun photo strips and print them on 4R photo paper. No account needed. Works entirely in your browser." />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="stylesheet" href="/vendor/tabler.min.css" />
		<title>DISTUDIO Photobooth</title>
		<script>
			// Pewarna shell pra-mount mengikuti tema kios tersimpan, agar boot
			// tidak berkedip dari default light bagi operator dark (dan sebaliknya).
			try {
				if (localStorage.getItem('distudio-theme') === 'dark') {
					document.documentElement.style.background = '#0B0A09';
					document
						.querySelector('meta[name="theme-color"]')
						?.setAttribute('content', '#0B0A09');
				}
			} catch {
				/* storage unavailable — shell memakai default light */
			}
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
