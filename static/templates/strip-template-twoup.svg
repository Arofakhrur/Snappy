<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 591 1772" width="2.33in" height="7in">
  <defs>
    <style>
      .safe-line { stroke: #10B981; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
      .label-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 18px; font-weight: 600; fill: #64748B; }
      .inst-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; fill: #64748B; }
    </style>
    <pattern id="checker" width="34.5" height="34.5" patternUnits="userSpaceOnUse">
      <rect width="34.5" height="34.5" fill="#EDE7DB"/>
      <rect width="17.2" height="17.2" fill="#E1D9C8"/>
      <rect x="17.2" y="17.2" width="17.2" height="17.2" fill="#E1D9C8"/>
    </pattern>
  </defs>

  <g id="artwork-layer">
    <rect x="0" y="0" width="591" height="1772" fill="#FBF7F0"/>
    <rect x="10" y="10" width="571" height="1752" fill="none" stroke="#C7A45C" stroke-width="1.6"/>

    <rect x="20" y="40" width="551" height="783" fill="url(#checker)" stroke="#2B2620" stroke-opacity="0.1" stroke-width="1"/>
    <rect x="20" y="839" width="551" height="783" fill="url(#checker)" stroke="#2B2620" stroke-opacity="0.1" stroke-width="1"/>

    <text x="295.5" y="1673" font-family="'Playfair Display', 'Georgia', serif" font-size="51" fill="#2B2620" text-anchor="middle" dominant-baseline="central">Two up</text>
    <text x="295.5" y="1724" font-family="'Inter', -apple-system, sans-serif" font-size="17" font-weight="600" fill="#B98A3F" text-anchor="middle" dominant-baseline="central" letter-spacing="5">PHOTO BOOTH</text>
  </g>

  <g id="guides-layer" opacity="0.85">
    <rect x="36" y="36" width="519" height="1700" class="safe-line"/>
    <text x="46" y="62" class="inst-text" fill="#10B981">SAFE PRINT MARGIN (3mm / 36px)</text>
    <text x="295.5" y="120" class="label-sub" text-anchor="middle">Two up — dua potret tumpuk (591 × 1772 px @ 300 DPI = 15 × 5 cm)</text>
    <text x="295.5" y="1620" class="inst-text" text-anchor="middle">2 salinan berdampingan di lembar 4R — matches renderStrip photoCount 2</text>
  </g>
</svg>
