<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1181 1772" width="4.65in" height="7in">
  <defs>
    <style>
      .safe-line { stroke: #10B981; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
      .label-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 18px; font-weight: 600; fill: #64748B; }
      .inst-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; fill: #64748B; }
    </style>
    <pattern id="checker" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#EDE7DB"/>
      <rect width="17" height="17" fill="#E1D9C8"/>
      <rect x="17" y="17" width="17" height="17" fill="#E1D9C8"/>
    </pattern>
  </defs>

  <g id="artwork-layer">
    <rect x="0" y="0" width="1181" height="1772" fill="#FBF7F0"/>
    <rect x="12" y="12" width="1157" height="1748" fill="none" stroke="#C7A45C" stroke-width="2"/>

    <rect x="32" y="60" width="546" height="620" fill="url(#checker)" stroke="#2B2620" stroke-opacity="0.1" stroke-width="1"/>
    <rect x="602" y="60" width="546" height="620" fill="url(#checker)" stroke="#2B2620" stroke-opacity="0.1" stroke-width="1"/>
    <rect x="32" y="704" width="546" height="620" fill="url(#checker)" stroke="#2B2620" stroke-opacity="0.1" stroke-width="1"/>
    <rect x="602" y="704" width="546" height="620" fill="url(#checker)" stroke="#2B2620" stroke-opacity="0.1" stroke-width="1"/>
    <rect x="32" y="1348" width="1117" height="250" fill="url(#checker)" stroke="#2B2620" stroke-opacity="0.1" stroke-width="1"/>

    <text x="590.5" y="1660" font-family="'Playfair Display', 'Georgia', serif" font-size="58" fill="#2B2620" text-anchor="middle" dominant-baseline="central">Five up</text>
    <text x="590.5" y="1718" font-family="'Inter', -apple-system, sans-serif" font-size="19" font-weight="600" fill="#B98A3F" text-anchor="middle" dominant-baseline="central" letter-spacing="7">PHOTO BOOTH</text>
  </g>

  <g id="guides-layer" opacity="0.85">
    <rect x="42" y="42" width="1097" height="1688" class="safe-line"/>
    <text x="52" y="70" class="inst-text" fill="#10B981">SAFE PRINT MARGIN (3,5mm / 42px)</text>
    <text x="590.5" y="120" class="label-sub" text-anchor="middle">Five up — 2×2 grid + satu menyamping (1181 × 1772 px @ 300 DPI = 10 × 15 cm)</text>
    <text x="590.5" y="1620" class="inst-text" text-anchor="middle">1 salinan utuh di lembar 4R — matches renderStrip photoCount 5</text>
  </g>
</svg>
