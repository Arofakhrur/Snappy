<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 709 1772" width="2.79in" height="7in">
  <defs>
    <style>
      .safe-line { stroke: #10B981; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
      .label-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 18px; font-weight: 600; fill: #64748B; }
      .inst-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; fill: #64748B; }
    </style>
    <pattern id="checker" width="41.6" height="41.6" patternUnits="userSpaceOnUse">
      <rect width="41.6" height="41.6" fill="#EDE7DB"/>
      <rect width="20.8" height="20.8" fill="#E1D9C8"/>
      <rect x="20.8" y="20.8" width="20.8" height="20.8" fill="#E1D9C8"/>
    </pattern>
  </defs>

  <g id="artwork-layer">
    <rect x="0" y="0" width="709" height="1772" fill="#FBF7F0"/>
    <rect x="10" y="10" width="689" height="1752" fill="none" stroke="#C7A45C" stroke-width="1.6"/>

    <rect x="22" y="44" width="665" height="515" fill="url(#checker)" stroke="#2B2620" stroke-opacity="0.1" stroke-width="1"/>
    <rect x="22" y="575" width="665" height="515" fill="url(#checker)" stroke="#2B2620" stroke-opacity="0.1" stroke-width="1"/>
    <rect x="22" y="1106" width="665" height="515" fill="url(#checker)" stroke="#2B2620" stroke-opacity="0.1" stroke-width="1"/>

    <text x="354.5" y="1673" font-family="'Playfair Display', 'Georgia', serif" font-size="51" fill="#2B2620" text-anchor="middle" dominant-baseline="central">Three up</text>
    <text x="354.5" y="1724" font-family="'Inter', -apple-system, sans-serif" font-size="17" font-weight="600" fill="#B98A3F" text-anchor="middle" dominant-baseline="central" letter-spacing="5">PHOTO BOOTH</text>
  </g>

  <g id="guides-layer" opacity="0.85">
    <rect x="36" y="36" width="637" height="1700" class="safe-line"/>
    <text x="46" y="62" class="inst-text" fill="#10B981">SAFE PRINT MARGIN (3mm / 36px)</text>
    <text x="354.5" y="120" class="label-sub" text-anchor="middle">Three up — tiga menyamping tumpuk (709 × 1772 px @ 300 DPI = 15 × 6 cm)</text>
    <text x="354.5" y="1620" class="inst-text" text-anchor="middle">1 salinan per lembar 4R — matches renderStrip photoCount 3</text>
  </g>
</svg>
