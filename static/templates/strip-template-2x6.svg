<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1800" width="2in" height="6in">
  <defs>
    <style>
      .guide-line { stroke: #2563EB; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
      .safe-line { stroke: #10B981; stroke-width: 2; stroke-dasharray: 4 4; fill: none; }
      .cut-line { stroke: #EF4444; stroke-width: 2; fill: none; }
      .label-title { font-family: 'Inter', -apple-system, sans-serif; font-size: 28px; font-weight: 800; fill: #1E293B; }
      .label-sub { font-family: 'Inter', -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #64748B; }
      .photo-box { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 2; rx: 8px; }
      .photo-label { font-family: 'Inter', -apple-system, sans-serif; font-size: 24px; font-weight: 700; fill: #2563EB; text-anchor: middle; dominant-baseline: central; }
      .inst-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; fill: #64748B; }
    </style>
  </defs>

  <!-- ============================================================ -->
  <!-- ARTWORK LAYER: Place your custom frame / illustration here!  -->
  <!-- Leave transparent cutouts where photos should be visible.    -->
  <!-- ============================================================ -->
  <g id="artwork-layer">
    <!-- Operator artwork goes here -->
  </g>

  <!-- ============================================================ -->
  <!-- GUIDES LAYER: HIDE OR DELETE THIS LAYER BEFORE EXPORTING PNG -->
  <!-- ============================================================ -->
  <g id="guides-layer" opacity="0.85">
    <!-- Outer Cut Boundary (600 x 1800 px = 2 x 6 in at 300 DPI) -->
    <rect x="0" y="0" width="600" height="1800" fill="none" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Safe Area Margin (5 mm ≈ 60 px from edge) -->
    <rect x="36" y="36" width="528" height="1728" class="safe-line"/>
    <text x="44" y="62" class="inst-text" fill="#10B981">SAFE PRINT MARGIN (5mm / 36px)</text>

    <!-- Header Area (Top Brand / Title) -->
    <rect x="40" y="80" width="520" height="110" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" rx="6"/>
    <text x="300" y="130" class="label-title" text-anchor="middle">DISTUDIO PHOTOBOOTH</text>
    <text x="300" y="162" class="label-sub" text-anchor="middle">2 × 6″ Strip Template (600 × 1800 px @ 300 DPI)</text>

    <!-- Suggested Photo Slot 1 -->
    <g transform="translate(48, 220)">
      <rect x="0" y="0" width="504" height="340" class="photo-box"/>
      <line x1="0" y1="0" x2="504" y2="340" stroke="#DBEAFE" stroke-width="2"/>
      <line x1="504" y1="0" x2="0" y2="340" stroke="#DBEAFE" stroke-width="2"/>
      <circle cx="252" cy="170" r="44" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
      <text x="252" y="170" class="photo-label">PHOTO 1</text>
    </g>

    <!-- Suggested Photo Slot 2 -->
    <g transform="translate(48, 590)">
      <rect x="0" y="0" width="504" height="340" class="photo-box"/>
      <line x1="0" y1="0" x2="504" y2="340" stroke="#DBEAFE" stroke-width="2"/>
      <line x1="504" y1="0" x2="0" y2="340" stroke="#DBEAFE" stroke-width="2"/>
      <circle cx="252" cy="170" r="44" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
      <text x="252" y="170" class="photo-label">PHOTO 2</text>
    </g>

    <!-- Suggested Photo Slot 3 -->
    <g transform="translate(48, 960)">
      <rect x="0" y="0" width="504" height="340" class="photo-box"/>
      <line x1="0" y1="0" x2="504" y2="340" stroke="#DBEAFE" stroke-width="2"/>
      <line x1="504" y1="0" x2="0" y2="340" stroke="#DBEAFE" stroke-width="2"/>
      <circle cx="252" cy="170" r="44" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
      <text x="252" y="170" class="photo-label">PHOTO 3</text>
    </g>

    <!-- Suggested Photo Slot 4 -->
    <g transform="translate(48, 1330)">
      <rect x="0" y="0" width="504" height="340" class="photo-box"/>
      <line x1="0" y1="0" x2="504" y2="340" stroke="#DBEAFE" stroke-width="2"/>
      <line x1="504" y1="0" x2="0" y2="340" stroke="#DBEAFE" stroke-width="2"/>
      <circle cx="252" cy="170" r="44" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
      <text x="252" y="170" class="photo-label">PHOTO 4</text>
    </g>

    <!-- Footer Area (Caption / Date Stamp) -->
    <rect x="40" y="1695" width="520" height="75" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" rx="6"/>
    <text x="300" y="1730" class="label-sub" text-anchor="middle">CAPTION &amp; DATE STAMP AREA</text>
    <text x="300" y="1754" class="inst-text" text-anchor="middle" font-size="12">Custom shapes &amp; asymmetric cutouts can be drawn anywhere</text>
  </g>
</svg>
